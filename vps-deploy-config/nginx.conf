# DishHome AI Nginx Server Block (VPS Setup)
# Domain: your-new-domain.com

server {
    listen 80;
    server_name your-new-domain.com www.your-new-domain.com; # Tapai ko naya domain yaha rakhne

    # Route all traffic to the Docker container's frontend port (3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
