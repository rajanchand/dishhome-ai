name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Compile backend
        run: python -m compileall -q backend/app api

      - name: Import FastAPI app
        env:
          APP_ENV: development
          ENABLE_AUDIO_SERVER: "false"
        run: |
          cd backend
          python - <<'PY'
          from app.main import app
          assert app.title == "DishHome AI Call Center"
          PY

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  compose:
    name: Compose Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate development compose
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config >/tmp/dev-compose.yml

      - name: Validate production compose
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          APP_SECRET_KEY: ci-secret-key-with-more-than-thirty-two-characters
          PUBLIC_BASE_URL: https://api.example.com
          CORS_ALLOWED_ORIGINS: https://app.example.com
          DATABASE_URL: postgresql://dishhome:ci-postgres-password@postgres:5432/dishhome_ai
        run: docker compose -f docker-compose.prod.yml config >/tmp/prod-compose.yml

  deploy:
    name: Deploy to VPS
    needs: [backend, frontend, compose]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        if: env.VPS_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /root/dishhome-ai || cd /root/website/dishhome-ai || cd /var/www/dishhome-ai || cd ~/dishhome-ai
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build
